name: DevSecOps Pipeline

on: [push]

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t my-first-image:latest .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'my-first-image:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Check Terraform Security (Checkov)
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform
          framework: terraform
          output_format: cli
          soft_fail: false

      - name: Run Semgrep (SAST)
        run: |
          pip install semgrep
          semgrep --config p/python --config p/owasp-top-ten --error --exclude-rule yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag .


      - name: Check Kubernetes Security (Trivy K8s)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'k8s/'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name: Test Secret (Safe)
        run: echo "The secret is ${{ secrets.MY_SECRET_PASSWORD }}"

      - name: Start HashiCorp Vault (Dev Mode)
        run: |
          docker run -d --name vault -p 8200:8200 -e 'VAULT_DEV_ROOT_TOKEN_ID=myroot' hashicorp/vault
          sleep 5

      - name: Write and Read Secret from Vault
        run: |
          # Устанавливаем переменные для подключения к Vault
          export VAULT_ADDR='http://127.0.0.1:8200'
          export VAULT_TOKEN='myroot'
          
          # Скачиваем клиент Vault (CLI)
          wget -O- https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt update && sudo apt install vault
          
          # Записываем секрет в Vault
          vault kv put secret/my-app db_password="SuperSecretVaultPassword!"
          
          # Читаем секрет обратно
          vault kv get secret/my-app

      - name: Health Check (Ping Prometheus)
        run: |
          echo "Checking if the monitoring service is alive..."
          curl -s -o /dev/null -w "%{http_code}" https://prometheus.io | grep "200" && echo "Prometheus is UP!" || (echo "Prometheus is DOWN!" && exit 1)

      - name: Start Juice Shop (Target)
        run: |
          docker run -d --name juice-shop -p 3000:3000 bkimminich/juice-shop
          # Ждем, пока приложение запустится
          sleep 15

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://localhost:3000'
          cmd_options: '-a -j'
          allow_issue_writing: false